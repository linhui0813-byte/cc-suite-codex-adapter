name: Prepare upstream cc-suite update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - id: check
        name: Check upstream package.json version without changing files
        run: |
          python3 scripts/check_update.py > update-check.json
          python3 -c 'import json; p=json.load(open("update-check.json")); print("available=" + str(p["update_available"]).lower())' >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.available == 'true'
        name: Sync exact commit and build candidate
        run: python3 scripts/sync_upstream.py
      - if: steps.check.outputs.available == 'true'
        name: Statically validate candidate before any branch write
        # This job has repository write permission. Never execute newly copied
        # upstream runtime code here; the read-only validation workflow tests
        # the pull request after it is created.
        run: |
          python3 -m py_compile scripts/*.py tests/test_adapter.py
          python3 scripts/validate_adapter.py
      - if: steps.check.outputs.available == 'true'
        name: Prepare update branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("provenance.lock.json"))["upstream"]["version"])')
          COMMIT=$(python3 -c 'import json; print(json.load(open("provenance.lock.json"))["upstream"]["commit"])')
          BRANCH="automation/cc-suite-v${VERSION}-${COMMIT:0:12}"
          EXISTING_PRS=$(gh pr list --head "$BRANCH" --state all --json number --jq length)
          if [ "$EXISTING_PRS" -gt 0 ]; then
            echo "An update PR already exists for ${VERSION} at ${COMMIT}; leaving it unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add provenance.lock.json plugins .agents/plugins/marketplace.json
          git commit -m "chore: prepare cc-suite ${VERSION} adapter update"
          git push --set-upstream origin "$BRANCH"
          gh pr create --base "$GITHUB_REF_NAME" --head "$BRANCH" --title "chore: update adapter to cc-suite ${VERSION}" --body "Automated candidate only. The package.json version selected this update; provenance pins the exact upstream commit and archive hash. Review provenance and tests before merge or activation."
